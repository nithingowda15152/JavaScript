<!DOCTYPE html>
<html lang="en">
<head>
<title>ECMAScript6</title>
</head>
<body>
    <h1>ES6 Features</h1>
    <script>
     // ! Rest parameter (...idetentifier) : improved way to handle the function parameters and it can store indefinite number of args in the form of array
    function demo(a,b,...c){
    console.log(a);  //2
    console.log(b); //4
    console.log(c);  //[1,3,5,6,7,8,9,10,12,11,13,14,15,16,17,18]
    }
    demo(2,4,1,3,5,6,7,8,9,10,12,11,13,14,15,16,17,18)

    // ! Spread operator(...iterable) : spread the values of an iterable obj
    let arr = [1,2,3,4,5,6,7,7,8,9]
    function nums(x,y,z,...rest){
    console.log(x);    //1
    console.log(y);    //2
    console.log(z);   //3
    console.log(rest);  //[4, 5, 6, 7, 7, 8, 9]
    }
    nums(arr[0],arr[1],arr[2])
    nums(...arr)

    const numbersOne = [1, 2, 3, 7]; 
    const numbersTwo = [4, 5, 6, 8]; 
    const numbersCombined = [...numbersOne, ...numbersTwo]; 
    console.log(numbersCombined);

    //Destructuring : easy to extract only what is needed.
    //1. Array destructuring : extracting array elements only which we need from large array and store them inside a variable in more readable way

    let colors = ['white','red','blue','green','yellow','orange','violet','aqua','pink','lightblue']
    //Example-1
    // ! destrcuture - red, orange and pink
    let [ ,s1, , , ,s2, , ,s3] = colors
    console.log(s1);
    console.log(s2);
    console.log(s3);

    //Example-2
    //destrcuture -- white,blue and yellow
    let [a1, ,a2, ,a3] = colors
    console.log(a1);
    console.log(a2);
    console.log(a3);

    //Example-3
    //destructure -- white, green,orange and violet
    let [q1, , ,q2, ,q3,q4] = colors
    console.log(q1,q2,q3,q4);

    //Example-4
    let [c1,c2,c3,c4,c5,c6,c7,c8] = colors
    console.log(c1);
    console.log(c2);
    console.log(c3);
    console.log(c4);
    console.log(c5);
    console.log(c6);
    console.log(c7);
    console.log(c8);

    //2.Object destrcturing
    let emp = {
    ename : 'ram',
    eid : 111,
    salary : 45000,
    skills : ['html','css','js','java','sql','react'],
    address : {
        city : 'mysore',
        state : 'kar'
    },
    role : 'Front-end developer',
    company : 'Infosys'
    }
    let {eid,salary,role,company,skills:[t1,t2,t3],address:{city,state}} = emp
    console.log(eid);
    console.log(salary);
    console.log(role);
    console.log(company);
    // console.log(skills);---wrong
    console.log(t1,t2,t3);
    console.log(address);
    console.log(state);
    console.log(city);
    
    </script>
</body>
</html>
