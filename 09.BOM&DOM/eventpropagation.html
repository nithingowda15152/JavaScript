</head>
<body>
    <div id="gp">

        </div>

        #gp{
            border: 2px solid red;

            width: 400px;
            display: flex;

        #parent{
            border: 2px solid red;
            height: 300px;
            width: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #child{
            border: 2px solid red;
            height: 200px;
            width: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
